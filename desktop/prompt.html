<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>MeCode</title>
<style>
  html, body { margin: 0; height: 100%; background: #121716; color: #f2f5f4; font: 15px/1.45 sans-serif; }
  main { padding: 24px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; }
  h1 { margin: 0 0 12px; font-size: 18px; }
  p { margin: 0; flex: 1; white-space: pre-wrap; overflow: auto; }
  #buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
  button { font: inherit; padding: 8px 16px; color: #f2f5f4; background: #2a3532; border: 1px solid #8a9a95; border-radius: 4px; cursor: pointer; }
  button:focus { outline: 3px solid #7cc4ff; outline-offset: 2px; }
</style>
</head>
<body>
<main role="alertdialog" aria-labelledby="message" aria-describedby="detail">
  <h1 id="message"></h1>
  <p id="detail"></p>
  <div id="buttons"></div>
</main>
</body>
</html>
