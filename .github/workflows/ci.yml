name: Prototype CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trusted-judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test trusted-fixture prototype
        run: python3 -B -W error -m unittest discover -s prototypes/trusted-judge -v
