name: Prototype CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trusted-judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test trusted-fixture prototype
        run: python3 -B -W error -m unittest discover -s prototypes/trusted-judge -v
      - name: Verify workspace inventory and members
        working-directory: prototypes/trusted-workspace
        run: |
          set -euo pipefail
          python3 -B inventory.py
          sha256sum -c SOURCE-SHA256.txt
          sha256sum -c ARTIFACT-SHA256.txt
      - name: Test workspace static boundaries (Chrome-free)
        working-directory: prototypes/trusted-workspace
        run: |
          set -euo pipefail
          MECODE_LOCAL_STATE=$(mktemp -d "${RUNNER_TEMP}/mecode-ws.XXXXXX")
          export MECODE_LOCAL_STATE
          python3 -B -W error -m unittest -v test_evidence.StaticBoundary.test_browser_has_no_execution_or_native_transport test_evidence.StaticBoundary.test_generator_identity_failure_before_any_launch
