name: CI

# Cheap CI on free standard public runners only. No releases, no public binary/image uploads, no paid runners.
# Failure-only text/screenshot artifacts (<= 3 days, small). Superseded runs on the same branch/PR are cancelled.
on:
  push:
    branches: [main, 'v2/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '0'
  NODE_VERSION: '26.7.0'

jobs:
  quality:
    name: quality (toolchain, format, lint, types, unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned dev dependencies from the lockfile (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Toolchain assertions (node/npm/dev dependency pins == lockfile)
        run: npm run verify:toolchain
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (tsc --noEmit, checkJs over src/ and scripts/)
        run: npm run typecheck
      - name: Unit tests (fake-engine and local-web socket tests; expect 177 pass, 0 skipped)
        run: |
          npm test 2>&1 | tee unit.log
          grep -E '^ℹ (tests|pass|fail|skipped)' unit.log
          grep -q '^ℹ tests 177$' unit.log && grep -q '^ℹ pass 177$' unit.log && grep -q '^ℹ fail 0$' unit.log && grep -q '^ℹ skipped 0$' unit.log
      - name: Catalog gate (48 problems / 18 patterns / provenance; every reference executed on every stored case; brute oracles; wrong baselines must fail; generated artifacts current)
        run: |
          set -o pipefail
          python3 --version
          python3 catalog-dev/catalog.py check 2>&1 | tee catalog.log
          tail -1 catalog.log | grep -qx 'OK'
          grep -q '"total": 48' catalog.log && grep -q '"patterns": 18' catalog.log && grep -q '"wrongBaselinesDiscriminating": 48' catalog.log
      - name: Catalog negative controls (each deliberate corruption must turn the gate RED; untouched copy GREEN)
        run: |
          set -o pipefail
          python3 catalog-dev/negative-controls.py 2>&1 | tee catalog-negative.log
          grep -q 'negative controls: ALL BEHAVED' catalog-negative.log

  engine-gui:
    name: real Docker + real browser (integration, GUI E2E, canaries, fresh package)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MECODE_E2E_SHOTS: ${{ github.workspace }}/test-results/gui
      MECODE_CANARY_LOGS: ${{ github.workspace }}/test-results/canary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Docker identity (hosted runner is ROOTFUL Docker - this is NOT proof of local rootless behaviour)
        run: |
          docker version --format 'client {{.Client.Version}} server {{.Server.Version}}'
          docker info --format 'security: {{.SecurityOptions}} cgroup: {{.CgroupDriver}} v{{.CgroupVersion}}'
          google-chrome --version
      - name: Build the engine image from the shipped recipe (engine/Dockerfile)
        run: docker build -t mecode-engine:v2 engine/
      - name: Runtime identities (build Node vs engine guest toolchains are distinct)
        run: node scripts/verify-toolchain.cjs --runtime
      - name: Real Docker integration tests (6, no skips)
        run: |
          mkdir -p test-results
          MECODE_REAL_DOCKER=1 npm run test:integration 2>&1 | tee test-results/integration.log
          grep -q '^ℹ tests 6$' test-results/integration.log && grep -q '^ℹ pass 6$' test-results/integration.log && grep -q '^ℹ skipped 0$' test-results/integration.log
      - name: Focused REAL Docker lifecycle (create/start split; stop at earliest startup; 2 tests, no skips)
        run: |
          set -o pipefail
          MECODE_REAL_DOCKER=1 node --test --test-concurrency=1 tests/integration/t31-lifecycle-docker.test.cjs 2>&1 | tee test-results/t31-lifecycle-docker.log
          grep -q '^ℹ tests 3$' test-results/t31-lifecycle-docker.log && grep -q '^ℹ pass 3$' test-results/t31-lifecycle-docker.log && grep -q '^ℹ skipped 0$' test-results/t31-lifecycle-docker.log
      - name: Leak probe (diagnostic only, never fails) before 'Catalog gate failure-path cleanup'
        if: always()
        run: node scripts/leak-probe.cjs 'before Catalog gate failure-path cleanup'
      - name: Catalog gate failure-path cleanup (2 dev-only regressions, no skips)
        run: |
          MECODE_REAL_DOCKER=1 node --test tests/integration/catalog-cleanup.test.cjs 2>&1 | tee test-results/catalog-cleanup.log
          grep -q '^ℹ tests 2$' test-results/catalog-cleanup.log && grep -q '^ℹ pass 2$' test-results/catalog-cleanup.log && grep -q '^ℹ skipped 0$' test-results/catalog-cleanup.log
      - name: Leak probe (diagnostic only, never fails) before 'Catalog real-container acceptance'
        if: always()
        run: node scripts/leak-probe.cjs 'before Catalog real-container acceptance'
      - name: Catalog real-container acceptance (FULL 111 jobs - 48 references ACCEPTED, 48 wrong baselines really judged, 3 regression solutions, 12 starters)
        run: |
          set -o pipefail
          MECODE_CATALOG_DOCKER_LOG="$PWD/test-results/catalog-docker.json" node scripts/catalog-docker-accept.cjs 2>&1 | tee test-results/catalog-docker.log
          grep -q '"mode":"full"' test-results/catalog-docker.log
          grep -q '"fullAcceptance":true' test-results/catalog-docker.log
          grep -q '"gateErrors":\[\]' test-results/catalog-docker.log
          grep -q '"total":111' test-results/catalog-docker.log
          grep -q '"unexpected":0' test-results/catalog-docker.log
          grep -q '"reference":{"n":48,"asExpected":48}' test-results/catalog-docker.log
          grep -q '"wrong":{"n":48,"asExpected":48}' test-results/catalog-docker.log
          grep -q '"solution":{"n":3,"asExpected":3}' test-results/catalog-docker.log
          grep -q '"starter":{"n":12,"asExpected":12}' test-results/catalog-docker.log
          grep -q '^ok   solution ticket-counter *c ' test-results/catalog-docker.log
          grep -q '^ok   solution prefix-directory *cpp ' test-results/catalog-docker.log
          grep -q '^ok   solution lone-signal *javascript ' test-results/catalog-docker.log
          test "$(grep -c '^ok   starter ' test-results/catalog-docker.log)" = 12
          grep -q '"taskOwnedContainersLeft":0' test-results/catalog-docker.log
      - name: Leak probe (diagnostic only, never fails) before 'GUI E2E in real Chrome'
        if: always()
        run: node scripts/leak-probe.cjs 'before GUI E2E in real Chrome'
      - name: GUI E2E in real Chrome against the real server + real engine (sandbox enabled)
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | sed -E 's/#s=[0-9a-f]{16,}/#s=REDACTED/g' | tee test-results/gui.log
          grep -q 'GUI-FLOW-COMPLETE' test-results/gui.log && grep -q 'GUI-ACCEPTED-FLOW-COMPLETE' test-results/gui.log
          grep -q '^ℹ fail 0$' test-results/gui.log && grep -q '^ℹ skipped 0$' test-results/gui.log
      - name: Leak probe (diagnostic only, never fails) before 'Negative canaries'
        if: always()
        run: node scripts/leak-probe.cjs 'before Negative canaries'
      - name: Negative canaries (each must go red at its NAMED assertion after real execution)
        run: |
          set -o pipefail
          npm run test:canary 2>&1 | sed -E 's/#s=[0-9a-f]{16,}/#s=REDACTED/g' | tee test-results/canary.log
      - name: Leak probe (diagnostic only, never fails) before 'Build platform archives, verify structur'
        if: always()
        run: node scripts/leak-probe.cjs 'before Build platform archives, verify structur'
      - name: Build platform archives, verify structure, run the fresh Linux package
        run: |
          set -o pipefail
          npm run package:platforms | tee test-results/package.log
          cat dist/platform/SHA256SUMS
          node scripts/verify-archives.cjs --run "$(ls dist/platform/*-linux.tar.gz)" --unit --extract-to "$RUNNER_TEMP/fresh" 2>&1 | sed -E 's/#s=[0-9a-f]{16,}/#s=REDACTED/g' | tee test-results/archives.log
      - name: Leak probe (diagnostic only, never fails) before 'Fresh extracted package - real Docker in'
        if: always()
        run: node scripts/leak-probe.cjs 'before Fresh extracted package - real Docker in'
      - name: Fresh extracted package - real Docker integration (6) and GUI E2E against the extracted tree
        run: |
          set -o pipefail
          APP="$(ls -d "$RUNNER_TEMP"/fresh/mecode-v2-*-linux)"
          (cd "$APP" && MECODE_REAL_DOCKER=1 node --test --test-concurrency=1 tests/integration/docker.test.cjs 2>&1 | tee "$GITHUB_WORKSPACE/test-results/fresh-integration.log")
          grep -q '^ℹ pass 6$' test-results/fresh-integration.log && grep -q '^ℹ skipped 0$' test-results/fresh-integration.log
          MECODE_E2E_APP_ROOT="$APP" npm run test:e2e 2>&1 | sed -E 's/#s=[0-9a-f]{16,}/#s=REDACTED/g' | tee test-results/fresh-gui.log
          grep -q 'GUI-ACCEPTED-FLOW-COMPLETE' test-results/fresh-gui.log
      - name: Leak probe (diagnostic only, never fails) before 'Offline gate'
        if: always()
        run: node scripts/leak-probe.cjs 'before Offline gate'
      - name: Offline gate - export under a task alias, remove ONLY that alias, fresh extracted package + fresh data, missing-image state, verified import, Retry, four real accepted languages (scoped app/browser evidence; no downloads, no uploads)
        run: |
          set -o pipefail
          node scripts/verify-offline.cjs --package "$(ls dist/platform/*-linux.tar.gz)" --out "$RUNNER_TEMP/offline-evidence" --browser 2>&1 | sed -E 's/#s=[0-9a-f]{16,}/#s=REDACTED/g' | tee test-results/offline.log
          grep -q '^OFFLINE-VERIFY passed=39 failed=0 ' test-results/offline.log
          ! grep -q '^FAIL ' test-results/offline.log
      - name: Leak probe (diagnostic only, never fails) before 'No task-owned containers left'
        if: always()
        run: node scripts/leak-probe.cjs 'before No task-owned containers left'
      - name: No task-owned containers left
        if: always()
        run: test -z "$(docker ps -aq --filter label=mecode.app=mecode-v2)"
      - name: Failure evidence (text/screenshots only, 3 days; binaries are never uploaded)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-evidence-${{ github.run_id }}
          path: |
            test-results/**/*.log
            test-results/**/*.txt
            test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore

  platform-archives:
    name: archive build + validate (${{ matrix.os }}; no Docker, binaries discarded)
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            archive: windows.zip
            smoke_flag: ''
          - os: macos-14
            archive: macos.tar.gz
            smoke_flag: '--docker-unavailable-smoke'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build all platform archives (deterministic; local to the runner)
        shell: bash
        run: npm run package:platforms
      - name: Verify structure of every archive and start the native launcher from a fresh extraction (no Docker run)
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-archives.cjs --run "$(ls dist/platform/*-${{ matrix.archive }})" ${{ matrix.smoke_flag }} 2>&1 | sed -E 's/#s=[0-9a-f]{16,}/#s=REDACTED/g'
      - name: Hashes and manifest summary (logged only; archives are discarded with the runner)
        shell: bash
        run: cat dist/platform/SHA256SUMS
